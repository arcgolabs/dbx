version: '3'

tasks:
  test:
    desc: Run tests for the root module.
    cmds:
      - go test ./...

  vet:
    desc: Run go vet for the root module.
    cmds:
      - go vet ./...

  test:workspace:
    desc: Run tests for every module in go.work.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        set -eu
        root="$PWD"
        status=0
        modules_file="$(mktemp)"
        trap 'rm -f "$modules_file"' EXIT
        go list -m -f '{{"{{.Dir}}"}}' > "$modules_file"
        while IFS= read -r module; do
          label="${module#$root/}"
          if [ "$label" = "$module" ]; then label="."; fi
          echo "==> go test $label"
          if ! (cd "$module" && go test ./...); then
            status=1
          fi
        done < "$modules_file"
        exit "$status"

  vet:workspace:
    desc: Run go vet for every module in go.work.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        set -eu
        root="$PWD"
        status=0
        modules_file="$(mktemp)"
        trap 'rm -f "$modules_file"' EXIT
        go list -m -f '{{"{{.Dir}}"}}' > "$modules_file"
        while IFS= read -r module; do
          label="${module#$root/}"
          if [ "$label" = "$module" ]; then label="."; fi
          echo "==> go vet $label"
          if ! (cd "$module" && go vet ./...); then
            status=1
          fi
        done < "$modules_file"
        exit "$status"

  lint:
    desc: Run golangci-lint for the root module.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --allow-parallel-runners ./...

  lint:module:
    internal: true
    dir: '{{.MODULE}}'
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --allow-parallel-runners ./...

  lint:workspace:
    desc: Run golangci-lint for every module in go.work.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        set -eu
        root="$PWD"
        status=0
        modules_file="$(mktemp)"
        trap 'rm -f "$modules_file"' EXIT
        go list -m -f '{{"{{.Dir}}"}}' > "$modules_file"
        while IFS= read -r module; do
          label="${module#$root/}"
          if [ "$label" = "$module" ]; then label="."; fi
          echo "==> golangci-lint $label"
          if ! (cd "$module" && go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 run --allow-parallel-runners ./...); then
            status=1
          fi
        done < "$modules_file"
        exit "$status"

  bench:typed-query:
    desc: Benchmark typed single-row and scalar query helpers.
    cmds:
      - go test -run ^$ -bench 'Benchmark(GetTyped|QueryOneTyped|FindTyped|QueryScalar)$' -benchmem

  ci:
    # golangci-lint does not yet support Go 1.27 generic methods:
    # https://github.com/golangci/golangci-lint/issues/6603
    desc: Run workspace test and vet checks.
    cmds:
      - task test:workspace
      - task vet:workspace
