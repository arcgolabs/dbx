name: release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          latest_flag=false
          if [[ "$TAG_NAME" == v* && "$TAG_NAME" != */* ]]; then
            latest_flag=true
          fi

          gh release create "$TAG_NAME" \
            --repo "$REPO" \
            --title "$TAG_NAME" \
            --generate-notes \
            --latest="$latest_flag" \
            --verify-tag
